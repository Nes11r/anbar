<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006381">
<title>Bağlantı yoxdur · HECOTEC</title>
<style>
  :root { --bg:#eef4f5; --sf:#fff; --ink:#15303a; --mut:#58707a; --acc:#e28221; --line:#d3e1e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b171b; --sf:#122229; --ink:#e3eef1; --mut:#8ea6af; --line:#233d47; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .box { background:var(--sf); border:1px solid var(--line); border-top:4px solid var(--acc); border-radius:10px; padding:28px 24px; max-width:380px; width:100%; text-align:center; }
  img { height:40px; background:#fff; border-radius:6px; padding:4px 8px; }
  h1 { font-size:18px; margin:16px 0 6px; }
  p { color:var(--mut); margin:0 0 18px; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:6px; border:0; background:var(--acc); color:#1c1105; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <img src="/hecotec-logo.png" alt="HECOTEC">
    <h1>Serverlə bağlantı yoxdur</h1>
    <p>İnternet və ya şirkət şəbəkəsinə qoşulmanı yoxlayın. Məlumatlar serverdə təhlükəsiz saxlanılır — bağlantı bərpa olunanda davam edə bilərsiniz.</p>
    <button onclick="location.reload()">Yenidən cəhd et</button>
  </div>
</body>
</html>
